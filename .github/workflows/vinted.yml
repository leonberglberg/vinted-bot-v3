# À placer dans le dépôt GitHub sous : .github/workflows/vinted.yml
name: vinted-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes (GitHub peut retarder un peu)
  workflow_dispatch:          # permet aussi de lancer à la main

concurrency:
  group: vinted-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python vinted_bot.py
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
